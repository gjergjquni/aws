openapi: 3.0.0
info:
  title: Aegis Backend API
  version: 1.0.0
  description: AI-powered return fraud detection system
servers:
  - url: https://q7phgdg1m5.execute-api.us-east-1.amazonaws.com/Prod
paths:
  /claims:
    post:
      summary: Submit a claim for fraud analysis
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [s3_url]
              properties:
                claim_id:
                  type: string
                  example: "CLAIM-123"
                customer_id:
                  type: string
                  example: "CUST-001"
                product_category:
                  type: string
                  example: "electronics"
                order_value_usd:
                  type: number
                  example: 299.99
                customer_text:
                  type: string
                  example: "The screen arrived cracked."
                s3_url:
                  type: string
                  example: "s3://aws-s3-877791042657-us-east-1-an/uploads/CLAIM-123/abc123.jpg"
                s3_key:
                  type: string
                  example: "uploads/CLAIM-123/abc123.jpg"
      responses:
        '202':
          description: Claim accepted; poll GET /analyze/{case_id} for status
    get:
      summary: List claims by customer
      parameters:
        - name: customer_id
          in: query
          required: true
          schema:
            type: string
          example: "CUST-001"
      responses:
        '200':
          description: List of claims for that customer
  /claims/{claim_id}:
    get:
      summary: Get a specific claim
      parameters:
        - name: claim_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Full claim details
  /uploads:
    post:
      summary: Get presigned S3 URL for image upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                claim_id:
                  type: string
                  example: "CLAIM-123"
                content_type:
                  type: string
                  enum: [image/jpeg, image/png]
                  example: image/jpeg
                filename:
                  type: string
                  example: "photo.jpg"
                content_length:
                  type: integer
                  example: 245760
      responses:
        '200':
          description: Presigned upload URL plus canonical s3_key / s3_url
