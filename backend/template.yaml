AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Aegis Backend

Parameters:
  VisualEvidenceUrl:
    Type: String
    Default: ""
  ClaimIntelligenceUrl:
    Type: String
    Default: ""
  OrchestratorUrl:
    Type: String
    Default: ""
  AegisApiUrl:
    Type: String
    Default: "https://xrx4q1jq0k.execute-api.us-east-1.amazonaws.com/prod"
  AegisApiKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: Agent API x-api-key. Pass at deploy time; never commit it.
  UploadBucketName:
    Type: String
    Default: ""
    Description: >-
      Optional override bucket for evidence uploads. Set this to the Agent
      API evidence bucket (with UploadPrefix=uploads) so uploaded images can
      actually be analyzed by Agent 1. Defaults to the stack's own bucket.
  UploadPrefix:
    Type: String
    Default: "evidence"
    Description: Key prefix for uploaded evidence objects.

Conditions:
  HasUploadBucket: !Not [!Equals [!Ref UploadBucketName, ""]]

Globals:
  Function:
    Timeout: 60
    Runtime: python3.13
    MemorySize: 512

Resources:
  ClaimsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: aegis_claims
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: claim_id
          AttributeType: S
        - AttributeName: customer_id
          AttributeType: S
        - AttributeName: created_at
          AttributeType: S
      KeySchema:
        - AttributeName: claim_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: customer-index
          KeySchema:
            - AttributeName: customer_id
              KeyType: HASH
            - AttributeName: created_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  EvidenceBucket:
    Type: AWS::S3::Bucket

  OrchestratorFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: app.lambda_handler
      Environment:
        Variables:
          TABLE_NAME: !Ref ClaimsTable
          BUCKET_NAME: !Ref EvidenceBucket
          VISUAL_EVIDENCE_URL: !Ref VisualEvidenceUrl
          CLAIM_INTELLIGENCE_URL: !Ref ClaimIntelligenceUrl
          ORCHESTRATOR_URL: !Ref OrchestratorUrl
          MODEL_ID: amazon.nova-pro-v1:0
          AEGIS_API_URL: !Ref AegisApiUrl
          AEGIS_API_KEY: !Ref AegisApiKey
          UPLOAD_BUCKET: !If [HasUploadBucket, !Ref UploadBucketName, !Ref EvidenceBucket]
          UPLOAD_PREFIX: !Ref UploadPrefix
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ClaimsTable
        - S3CrudPolicy:
            BucketName: !Ref EvidenceBucket
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: "*"
            - Effect: Allow
              Action:
                - s3:PutObject
                - s3:GetObject
              Resource: !If
                - HasUploadBucket
                - !Sub "arn:aws:s3:::${UploadBucketName}/*"
                - !Sub "arn:aws:s3:::${EvidenceBucket}/*"
      Events:
        SubmitClaim:
          Type: Api
          Properties:
            Path: /claims
            Method: post
        GetClaim:
          Type: Api
          Properties:
            Path: /claims/{claim_id}
            Method: get
        ListClaims:
          Type: Api
          Properties:
            Path: /claims
            Method: get
        GetUploadUrl:
          Type: Api
          Properties:
            Path: /uploads
            Method: post
        ListPending:
          Type: Api
          Properties:
            Path: /claims/pending
            Method: get
        ClaimDecision:
          Type: Api
          Properties:
            Path: /claims/{claim_id}/decision
            Method: patch
        AnalyzeSubmit:
          Type: Api
          Properties:
            Path: /analyze
            Method: post
        AnalyzeStatus:
          Type: Api
          Properties:
            Path: /analyze/{case_id}
            Method: get
        ReviewsPending:
          Type: Api
          Properties:
            Path: /reviews/pending
            Method: get
        ReviewDecision:
          Type: Api
          Properties:
            Path: /reviews/{case_id}/decision
            Method: post

Outputs:
  ApiUrl:
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod"
  TableName:
    Value: !Ref ClaimsTable
  BucketName:
    Value: !Ref EvidenceBucket
